# Render blueprint — API only.
#
# The database lives on Neon (free tier, persistent, PostgreSQL 17), not on
# Render, so there is no `databases:` block here. Set DATABASE_URL to the
# Neon connection string in the Render dashboard.
#
# The frontend goes to Vercel separately; it is a Next.js app and Vercel's
# free tier serves it far better than a Render web service would.
services:
  - type: web
    name: kosh-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Neon connection string. app/core/config.py rewrites the scheme to
      # postgresql+psycopg:// automatically, so paste Neon's URL unchanged.
      - key: DATABASE_URL
        sync: false
      # Your Vercel production URL. Preview deployments are already allowed
      # by the *.vercel.app regex in app/main.py.
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
